<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TodoList{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{% url 'task_list' %}">✓ TodoList</a>
  <nav>
    {% if user.is_authenticated %}
      <span class="muted">{{ user.username }}</span>
      <form method="post" action="{% url 'logout' %}" class="inline-form">
        {% csrf_token %}<button class="link-button" type="submit">Выйти</button>
      </form>
    {% else %}
      <a href="{% url 'login' %}">Войти</a>
      <a href="{% url 'signup' %}">Регистрация</a>
    {% endif %}
  </nav>
</header>
<main class="container">
  {% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
